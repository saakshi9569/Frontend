<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta type="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body font-family: Arial bgcolor="Black">
    <table bgcolor="darkblue" align="center" width="600" border="0" cellspacing="0" cellpadding="6">
        <tr bgcolor="orange">
            <td colspan="2">
                <font color="white" size="5"><b>&nbsp;&nbsp;Sign Up</b></font>
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>First Name</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="text" placeholder="Enter First Name">
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Last Name</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="text" placeholder="Enter Last Name">
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Date of Birth</b></font>
            </td>
            <td>
                <!-- &nbsp;&nbsp;<input type="date" placeholder="Date"> -->
                &nbsp;&nbsp;<select><option name="Date">Date</option></select>
                &nbsp;&nbsp;<select><option name="Month">Month</option></select>
                &nbsp;&nbsp;<select><option name="Year">Year</option></select>
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Gender</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="radio"><label><font size="3" color="yellow"><b>Male</b></font></label>
                &nbsp;&nbsp;<input type="radio"><label><font size="3" color="yellow"><b>Female</b></font></label>
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Country</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<select>
                    <option>Country</option>
                    <option>India</option>
                    <option>Denmark</option>
                    <option>United States</option>
                </select>
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>E-mail</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="text" placeholder="Enter E-mail">
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Phone</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="text" placeholder="Enter Phone">
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Password</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="password">
            </td>
        </tr>
        <tr>
            <td align="right">
                <font size="3" color="yellow"><b>Confirm Password</b></font>
            </td>
            <td>
                &nbsp;&nbsp;<input type="password">
            </td>
        </tr>
        <tr>
            <td align="right">
            </td>
            <td>
                &nbsp;&nbsp;<input type="checkbox">
                <font size="3" color="yellow">
                    <b>I Agree to the Terms of use</b>
                </font>
            </td>
        </tr>
        <tr bgcolor="orange" align="right">
            <td></td>
            <td>
                <button type="submit"><font color="green" size="4">Submit</font></button>
                <button type="reset"><font color="red" size="4">Cancel</font></button>
            </td>
        </tr>
    </table>
</body>
</html>
