<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body font-family: Arial>
    <table bgcolor="purple" align="center" width="600" border="0" cellpadding="2" cellspacing="0">
        <tr height="20">
        </tr>
        <tr align="center">
            <td><b><font color="white" size="5"><i>Spa Client Intake Form</i></font></b></td>
        </tr>
        <tr height="20">
        </tr>
    </table>
    <table bgcolor="purple" align="center" width="600" border="0" cellpadding="2" cellspacing="5">
        <tr>
            <td width="10%"></td>
            <td width="20%"><hr width="150" color="pink"></td>
            <td width="20%"><hr width="150"></td>
            <td width="20%"><hr width="150"></td>
            <td width="10%"></td>
        </tr>
        <tr align="center">
            <td width="10%"></td>
            <td width="20%">
                <font color="pink" size="3">Client Details</font>
            </td>
             <td width="20%">
                <font color="white" size="3">Emergency Contact Details</font>
            </td>
            <td width="20%">
                <font color="white" size="3">Services & Checkout</font>
            </td>
            <td width="10%"></td>
        </tr>
         <tr height="20">
        </tr>
    </table>
    <table bgcolor="purple" align="center" width="600" border="0" cellpadding="2" cellspacing="4">
        <tr align="center">
            <td width="10%"></td>
            <th colspan="1" align="left">
                <font color="white" size="3"><b>Name</b></font>
            </th>
            <td width="10%"></td>
            <td width="10%"></td>
        </tr>
        <tr>
            <td width="10%"></td>
            <td width="40%" align="left">
                <input type="text" name="first_name">
            </td>
            <td width="40%" align="right">
                <input type="text" name="last_name"> 
            </td>
            <td width="10%"></td>
        </tr>
        <tr align="left">
            <td width="10%"></td>
            <td width="40%">
                <font color="white" size="3">First Name</font>
            </td>
            <td width="40%">
                <font color="white" size="3">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    &nbsp;&nbsp;&nbsp;&nbsp;Last Name
                </font>
            </td>
            <td width="10%"></td>
        </tr>
        <tr height="20"></tr>
        <tr align="left">
            <td ></td>
            <td colspan="2">
                <font color="white" size="3"><label><b>Phone</b></label></font><br>
                 <input type="text" size="57">
            </td>
            <td></td>
        </tr>
        <tr height="20"></tr>
        <tr align="left">
            <td width="10%"></td>
            <td colspan="2">
                <font color="white" size="3"><label><b>Email</b></label></font><br>
                <input type="email" size="57">
            </td>
            <td width="10%"></td>
        </tr>
        <tr height="20"></tr>
        <tr align="left">
            <td width="10%"></td>
            <td colspan="2">
                <font color="white" size="3"><label><b>Address</b></label></font><br>
                <input type="text" size="57"><br>
                <font color="white" size="3"><label>Street Address</label></font><br>
                <input type="text" size="57"><br>
                <font color="white" size="3"><label>Address Line 2</label></font><br>
            </td>
            <td width="10%"></td>
        </tr>
        <tr>
            <td width="10%"></td>
            <td width="40%" align="left">
                <input type="text"><br>
                <font color="white" size="3"><label>City</label></font><br>
            </td>
            <td width="40%" align="right">
                <input type="text"><br> 
                <font color="white" size="3">
                    <label>State/Region/Province&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                </font><br>
            </td>
            <td width="10%"></td>
        </tr>
        <tr>
            <td width="10%"></td>
            <td width="40%" align="left">
                <input type="text"><br>
                <font color="white" size="3"><label>Postal/Zip Code</label></font><br>
            </td>
            <td width="40%" align="right">
                <input type="text"><br> 
                <!-- <select>
                    <option value="">Select Country</option>
                    <option value="india">India</option>
                    <option value="usa">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="canada">Canada</option>
                    <option value="australia">Australia</option>
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                    <option value="japan">Japan</option>
                </select> -->
                <font color="white" size="3">
                    <label>Country&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        &nbsp;&nbsp;
                    </label>
                </font><br>
            </td>
            <td width="10%"></td>
        </tr>
        <tr height="20%"></tr>
    </table> 
    <table bgcolor="purple" align="center" width="600" border="0" cellpadding="8" cellspacing="5">
        <tr height="20"></tr>
        <tr align="center">
            <td width="10%"></td>
            <td>
                <button type="simple">
                    <font size="3"><b>Next</b></font>
                </button>
            </td>
            <td width="10%"></td>
        </tr>
        <tr>
            <td width="10%"></td>
            <td></td>
            <td width="10%" align="left">
                <font color="white" size="3">1/3</font>
            </td>
        </tr>
        <tr height="30">
        </tr>
    </table> 
</body>
</html>
